<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ page.title }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f4f4f4;
      color: #003366;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #fff;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #ccc;
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #003366;
      font-weight: bold;
    }

    .container {
      display: flex;
      justify-content: space-between;
      padding: 40px;
      max-width: 1000px;
      margin: auto;
      background-color: #ffffff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
    }

    .content {
      max-width: 60%;
    }

    .profile-pic {
      max-width: 300px;
      border-radius: 8px;
    }

    .btn {
      background-color: #003366;
      color: white;
      padding: 12px 24px;
      border: none;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
      margin-top: 20px;
      border-radius: 6px;
    }

    footer {
      text-align: center;
      margin: 40px 0;
      font-size: 14px;
      color: #777;
    }

  </style>
</head>
<body>
  <header>
    <h1>{{ site.title }}</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/projects.html">Projects</a>
      <a href="/resume.html">Resume</a>
      <a href="/about.html">About Me</a>
      <a href="/misc.html">Misc</a>
      <a href="https://linkedin.com/in/tristan-feng-3159a2264" target="_blank">LinkedIn</a>
    </nav>
  </header>

  <div class="container">
    <div class="content">
      {{ content }}
      <a href="/projects.html" class="btn">Explore My Work</a>
  </div>

  <footer>
    &copy; {{ site.title }} — Contact: rf468@cornell.edu
  </footer>
</body>
</html>
